<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnoLimits Viewer – Jordan Herbert</title>

  <!-- Bootstrap (matching your Quarto site) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- GeoTIFF.js + georaster -->
  <script src="https://unpkg.com/geotiff@2.0.7/dist-browser/geotiff.js"></script>
  <script src="https://unpkg.com/georaster@1.5.6/dist/georaster.browser.bundle.min.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Source Serif 4", Georgia, serif;
      background: #f8f9fa;
      color: #212529;
    }

    /* Matching your Quarto dark navbar */
    .navbar {
      background: #1e2327 !important;
      padding: 0.6rem 1.5rem;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      color: #fff !important;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .navbar-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .navbar-links a:hover { color: #fff; }

    /* Page layout */
    .page-wrapper {
      padding-top: 56px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header strip */
    .viewer-header {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: 1rem 1.5rem 0.75rem;
    }

    .viewer-header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1e2327;
      margin-bottom: 0.15rem;
    }

    .viewer-header p {
      font-size: 0.85rem;
      color: #6c757d;
      margin: 0;
    }

    /* Controls bar */
    .controls-bar {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #495057;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    #date-slider {
      width: 280px;
      accent-color: #2c6fad;
    }

    #date-display {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e2327;
      min-width: 100px;
    }

    #loading-msg {
      font-size: 0.82rem;
      color: #6c757d;
      font-style: italic;
    }

    /* Map */
    #map {
      flex: 1;
      width: 100%;
    }

    /* Legend */
    .legend {
      background: rgba(255,255,255,0.95);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 12px;
      min-width: 130px;
    }

    .legend-title {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #495057;
      margin-bottom: 6px;
    }

    .legend-bar {
      height: 12px;
      border-radius: 3px;
      background: linear-gradient(to right,
        #f7fbff, #c6dbef, #6baed6, #2171b5, #08306b);
      margin-bottom: 4px;
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #6c757d;
    }

    /* Info panel */
    .info-panel {
      background: rgba(255,255,255,0.95);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 12px;
      min-width: 160px;
    }

    .info-panel h4 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #495057;
      margin-bottom: 6px;
    }

    .snotel-popup {
      font-size: 13px;
      line-height: 1.5;
    }

    .snotel-popup strong { color: #1e2327; }
  </style>
</head>

<body>

<!-- Navbar matching your Quarto site -->
<nav class="navbar">
  <a class="navbar-brand" href="./index.html">Jordan Herbert - Earth Data Scientist</a>
  <div class="navbar-links">
    <a href="./index.html">Home</a>
    <a href="./pubs.html">Publications</a>
    <a href="./blog.html">Blog</a>
    <a href="./herbert_cv.pdf">CV</a>
  </div>
</nav>

<div class="page-wrapper">

  <!-- Header -->
  <div class="viewer-header">
    <h1>SnoLimits — Colorado SWE Viewer</h1>
    <p>500 m daily snow water equivalent estimates, WY2026. Powered by random forest models trained on lidar surveys and SNOTEL observations.</p>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="control-group">
      <label>Date</label>
      <input type="range" id="date-slider" min="0" max="0" value="0">
      <span id="date-display">—</span>
    </div>
    <div class="control-group">
      <label>Opacity</label>
      <input type="range" id="opacity-slider" min="0" max="100" value="85" style="width:100px; accent-color:#2c6fad;">
    </div>
    <span id="loading-msg">Loading data...</span>
  </div>

  <!-- Map -->
  <div id="map"></div>

</div>

<script>
// ============================================================
// CONFIG — update these URLs after uploading to GitHub Releases
// ============================================================

// List your COG files here in date order
// Replace your static DATES array with this
function generateDates(start, end) {
  const dates = [];
  let d = new Date(start + 'T00:00:00');
  const last = new Date(end + 'T00:00:00');
  while (d <= last) {
    const s = d.toISOString().slice(0, 10).replace(/-/g, '');
    dates.push({
      date: d.toISOString().slice(0, 10),
      url:  `./data/swe/SWE_CO_${s}.tif`,
    });
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

const DATES = generateDates('2025-10-01', '2026-05-04');

// SNOTEL stations (add your actual stations here)
const SNOTEL_STATIONS = [];

// SWE color ramp (white -> light blue -> deep blue)
const SWE_MAX = 1;  // meters — adjust to your data range
function sweToColor(val) {
  if (isNaN(val) || val <= 0) return null;
  const t   = Math.min(val / SWE_MAX, 1);
  const r   = Math.round(247 - t * 239);
  const g   = Math.round(251 - t * 202);
  const b   = Math.round(255 - t * 187);
  return [r, g, b, 200];
}

// ============================================================
// Map setup
// ============================================================

const map = L.map('map', {
  center: [39.0, -105.5],
  zoom: 7,
  zoomControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  maxZoom: 19,
}).addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">SWE (m)</div>
    <div class="legend-bar"></div>
    <div class="legend-labels"><span>0</span><span>${SWE_MAX}</span></div>
  `;
  return div;
};
legend.addTo(map);

// ============================================================
// Layer management
// ============================================================

let currentLayer = null;
let layerCache   = {};
const slider     = document.getElementById('date-slider');
const dateLabel  = document.getElementById('date-display');
const loadingMsg = document.getElementById('loading-msg');
const opSlider   = document.getElementById('opacity-slider');

slider.max = DATES.length - 1;

async function loadLayer(idx) {
  const { date, url } = DATES[idx];
  dateLabel.textContent = date;

  if (layerCache[idx]) {
    swapLayer(layerCache[idx]);
    loadingMsg.textContent = '';
    return;
  }

  loadingMsg.textContent = 'Loading...';

  try {
    const response  = await fetch(url);
    const arrayBuf  = await response.arrayBuffer();
    const georaster = await parseGeoraster(arrayBuf);

    const layer = new GeoRasterLayer({
      georaster,
      opacity:    parseFloat(opSlider.value) / 100,
      pixelValuesToColorFn: vals => {
        const v = vals[0];
        if (v === georaster.noDataValue || isNaN(v) || v <= 0) return null;
        const c = sweToColor(v);
        return c ? `rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})` : null;
      },
      resolution: 128,
    });

    layerCache[idx] = layer;
    swapLayer(layer);
    loadingMsg.textContent = '';
  } catch (e) {
    loadingMsg.textContent = 'Error loading layer';
    console.error(e);
  }
}

function swapLayer(newLayer) {
  if (currentLayer) map.removeLayer(currentLayer);
  currentLayer = newLayer;
  currentLayer.addTo(map);
}

// Slider interaction
let debounceTimer;
slider.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => loadLayer(parseInt(slider.value)), 150);
  dateLabel.textContent = DATES[parseInt(slider.value)].date;
});

// Opacity
opSlider.addEventListener('input', () => {
  if (currentLayer) currentLayer.setOpacity(parseInt(opSlider.value) / 100);
});

// SNOTEL dots
SNOTEL_STATIONS.forEach(s => {
  L.circleMarker([s.lat, s.lon], {
    radius: 5, color: '#c0392b', fillColor: '#e74c3c',
    fillOpacity: 0.9, weight: 1.5,
  })
  .bindPopup(`<div class="snotel-popup"><strong>${s.name}</strong><br>SWE: ${s.swe !== null ? s.swe.toFixed(3) + ' m' : 'N/A'}</div>`)
  .addTo(map);
});

// Load first date
loadLayer(0);
</script>

</body>
</html>
